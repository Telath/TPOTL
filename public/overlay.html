<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        background: transparent;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: white;
        margin: 0;
        /* Espace en haut de 7rem pour laisser la place au logo en haut à droite et au bandeau */
        padding: 2rem 2.5rem 2rem 2.5rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
        box-sizing: border-box;
      }

      /* Logo d'émission en haut à droite */
      .show-logo {
        position: fixed;
        top: 25px;
        right: 35px;
        width: 150px;
        height: auto;
        z-index: 100;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
      }

      /* Zone supérieure pour la boîte du joueur dupliquée */
      .top-banner {
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2;
        margin-bottom: 10px;
        width: 100%;
        flex-shrink: 0;
      }

      /* Conteneur principal */
      .main-layout {
        display: flex;
        justify-content: space-between;
        width: 100%;
        z-index: 1;
        box-sizing: border-box;
        flex-grow: 1;
        align-items: center;
      }

      /* Colonnes de 10 éléments */
      .column {
        display: grid;
        grid-template-columns: 330px;
        grid-template-rows: repeat(10, 52px);
        gap: 8px;
      }

      /* Conteneur de la boîte / bannière */
      .box-container {
        width: 330px;
        height: 52px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          filter 0.5s ease,
          opacity 0.5s ease,
          transform 0.3s ease;
      }

      /* Image de fond (coup de pinceau) */
      .box-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("mark_3.png");
        background-size: 100% 100%;
        background-repeat: no-repeat;
        background-position: center;
        z-index: 1;
        transition:
          filter 0.5s ease,
          transform 0.3s ease;
      }

      /* Effet miroir horizontal sur l'image pour la colonne de droite */
      .right-box .box-bg {
        transform: scaleX(-1);
      }

      /* Contenu texte au-dessus du coup de pinceau */
      .box-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        font-weight: 900;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }

      .box-text {
        font-size: 22px;
        text-transform: uppercase;
        color: #ffffff;
      }

      /* Valeur dorée quand la boîte est ouverte */
      .box-container.opened .box-text {
        color: #f1c40f;
        font-size: 24px;
      }

      /* État OUVERT : Passage en noir et blanc + semi-transparence (sauf pour la boîte du joueur) */
      .box-container.opened:not(.player-box) {
        filter: grayscale(100%);
        opacity: 0.5;
      }

      /* Style spécifique pour la boîte du joueur */
      .player-box {
        filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.8)) !important;
        opacity: 1 !important;
      }

      .player-badge {
        position: absolute;
        top: -12px;
        background: #f1c40f;
        color: #000;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: 900;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        z-index: 5;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      /* Particules d'or */
      .particle {
        position: fixed;
        width: 10px;
        height: 10px;
        background: #f1c40f;
        border-radius: 50%;
        pointer-events: none;
        animation: flyOut 1s ease-out forwards;
        z-index: 10;
      }

      @keyframes flyOut {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--tw-x), var(--tw-y)) scale(0);
        }
      }
    </style>
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <!-- Fichiers audio -->
    <audio id="bg-music" src="ambiance.mp3"></audio>
    <audio id="sfx-good" src="audio/open-good.mp3"></audio>
    <audio id="sfx-bad" src="audio/open-bad.mp3"></audio>

    <!-- Logo d'émission en haut à droite -->
    <img src="logo.png" alt="Logo de l'émission" class="show-logo" />

    <!-- Zone supérieure : Duplication de la boîte du joueur -->
    <div id="top-banner" class="top-banner"></div>

    <!-- Colonnes : 10 boîtes à gauche / 10 boîtes à droite -->
    <div class="main-layout">
      <div id="left-column" class="column"></div>
      <div id="right-column" class="column"></div>
    </div>

    <script>
      const socket = io();
      let previousState = null;
      const bgMusic = document.getElementById("bg-music");
      const sfxGood = document.getElementById("sfx-good");
      const sfxBad = document.getElementById("sfx-bad");

      socket.on("playOpenSound", (soundType) => {
        if (soundType === "good") {
          sfxGood.currentTime = 0;
          sfxGood.play().catch((e) => console.log("Erreur audio :", e));
        } else if (soundType === "bad") {
          sfxBad.currentTime = 0;
          sfxBad.play().catch((e) => console.log("Erreur audio :", e));
        }
      });

      bgMusic.addEventListener("timeupdate", () => {
        socket.emit("updateMusicTime", {
          currentTime: bgMusic.currentTime,
          duration: bgMusic.duration,
        });
      });

      socket.on("musicSeek", (time) => {
        bgMusic.currentTime = time;
      });

      function renderBoxHtml(box, isPlayerBox) {
        const textToDisplay = box.isOpened ? box.value : `Boîte ${box.id}`;
        return `
          ${isPlayerBox ? '<div class="player-badge">JOUEUR</div>' : ""}
          <div class="box-bg"></div>
          <div class="box-content">
            <span class="box-text">${textToDisplay}</span>
          </div>
        `;
      }

      socket.on("stateUpdate", (state) => {
        const leftCol = document.getElementById("left-column");
        const rightCol = document.getElementById("right-column");
        const topBanner = document.getElementById("top-banner");

        if (state.music) {
          bgMusic.volume = state.music.volume;
          bgMusic.loop = state.music.isLooping;

          if (state.music.isPlaying) {
            if (bgMusic.paused)
              bgMusic.play().catch((e) => console.log("Autoplay bloqué."));
          } else {
            if (!bgMusic.paused) bgMusic.pause();
          }
        }

        if (previousState) {
          state.boxes.forEach((box) => {
            const prevBox = previousState.boxes.find((b) => b.id === box.id);
            if (prevBox && !prevBox.isOpened && box.isOpened) {
              triggerSparkles(box.id);
            }
          });
        }

        leftCol.innerHTML = "";
        rightCol.innerHTML = "";
        topBanner.innerHTML = "";

        state.boxes.forEach((box, index) => {
          const isPlayerBox = state.playerBoxId === box.id;
          const isRightSide = index >= 10;

          const boxContainer = document.createElement("div");
          boxContainer.className = `box-container ${isPlayerBox ? "player-box" : ""} ${box.isOpened ? "opened" : ""} ${isRightSide ? "right-box" : ""}`;
          boxContainer.id = `box-node-${box.id}`;
          boxContainer.innerHTML = renderBoxHtml(box, isPlayerBox);

          if (!isRightSide) {
            leftCol.appendChild(boxContainer);
          } else {
            rightCol.appendChild(boxContainer);
          }
        });

        if (state.playerBoxId !== null) {
          const playerBox = state.boxes.find((b) => b.id === state.playerBoxId);
          if (playerBox) {
            const topBoxContainer = document.createElement("div");
            topBoxContainer.className = `box-container player-box ${playerBox.isOpened ? "opened" : ""}`;
            topBoxContainer.style.transform = "scale(1.15)";
            topBoxContainer.innerHTML = renderBoxHtml(playerBox, true);
            topBanner.appendChild(topBoxContainer);
          }
        }

        previousState = state;
      });

      function triggerSparkles(boxId) {
        const element = document.getElementById(`box-node-${boxId}`);
        if (!element) return;

        const rect = element.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        for (let i = 0; i < 30; i++) {
          const particle = document.createElement("div");
          particle.className = "particle";

          const angle = Math.random() * Math.PI * 2;
          const dist = 50 + Math.random() * 100;
          const x = Math.cos(angle) * dist + "px";
          const y = Math.sin(angle) * dist + "px";

          particle.style.left = `${centerX}px`;
          particle.style.top = `${centerY}px`;
          particle.style.setProperty("--tw-x", x);
          particle.style.setProperty("--tw-y", y);

          document.body.appendChild(particle);
          setTimeout(() => particle.remove(), 1000);
        }
      }
    </script>
  </body>
</html>
